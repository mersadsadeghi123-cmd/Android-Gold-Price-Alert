plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mersad.gold18'

    signingConfigs {
        release {
            storeFile file('../merGold-release.jks')
            storePassword System.getenv("MERGOLD_STORE_PASSWORD")
            keyAlias 'mrgold'
            keyPassword System.getenv("MERGOLD_KEY_PASSWORD")
        }
    }
    compileSdk 36

    defaultConfig {
        applicationId 'com.mersad.gold18'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

dependencies {
}

